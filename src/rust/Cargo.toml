[package]
name = 'rattlerthis'
publish = false
version = '0.1.0'
edition = '2021'
rust-version = '1.75'

[lib]
crate-type = [ 'rlib', 'staticlib' ]
name = 'rattlerthis'

[[bin]]
name = 'document'
path = 'document.rs'

[dependencies]
extendr-api = '0.9'
tokio = { version = '1', default-features = false, features = ['rt-multi-thread'] }
thiserror = '2'

rattler = { version = '0.47', default-features = false, features = ['rustls'] }
rattler_conda_types = { version = '0.48' }
rattler_digest = { version = '1', default-features = false }
rattler_solve = { version = '7', default-features = false, features = ['resolvo'] }
rattler_repodata_gateway = { version = '0.30', default-features = false, features = ['gateway', 'rustls'] }
rattler_shell = { version = '0.27' }
rattler_virtual_packages = { version = '3' }
rattler_cache = { version = '0.10', default-features = false, features = ['rustls'] }
url = '2'

# Wheel installation (the `conda-pypi` channel serves raw `.whl` files that
# rattler's own Installer/PackageCache do not yet know how to fetch or link;
# see PLAN.md "Wheel packages").
reqwest = { version = '0.13', default-features = false, features = ['rustls'] }
zip = { version = '8', default-features = false, features = ['deflate'] }

[dev-dependencies]
tempfile = '3'

[profile.release]
lto = true
codegen-units = 1
