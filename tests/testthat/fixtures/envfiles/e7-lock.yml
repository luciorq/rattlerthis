# Environment file fixture (template); placeholders and channels as in e1.yml.
# e7: a conda-lock (version 1) file. Only the conda packages of category main
# for the target platform are installed: baz on every platform, foo on
# linux-64 only; devtool (category dev) never.
# Keep metadata.channels as it is. micromamba 2.10.0 mishandles a file://
# package whose channel is the last entry there: its record gets an empty
# channel, and a lock of a single such package fails to download ("Download
# error (37)": it requests <channel>/<channel>/noarch/<file>). rattler is not
# affected, so listing chA or chC last would break the comparison.
version: 1
metadata:
  content_hash: {linux-64: e7, linux-aarch64: e7, osx-64: e7, osx-arm64: e7, win-64: e7, win-arm64: e7}
  channels: [{url: '@CHANNEL_DIR@/chC', used_env_vars: []}, {url: '@CHANNEL_DIR@/chD', used_env_vars: []}]
  platforms: [linux-64, linux-aarch64, osx-64, osx-arm64, win-64, win-arm64]
  sources: [environment.yml]
package:
- name: foo
  version: '1.0'
  manager: conda
  platform: linux-64
  dependencies: {}
  url: '@CHANNEL_DIR@/chA/noarch/foo-1.0-0.tar.bz2'
  hash: {md5: '@MD5:chA/noarch/foo-1.0-0.tar.bz2@', sha256: '@SHA256:chA/noarch/foo-1.0-0.tar.bz2@'}
  category: main
  optional: false
- name: baz
  version: '1.0'
  manager: conda
  platform: linux-64
